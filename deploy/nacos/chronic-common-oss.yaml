# =============================================================================
# Nacos 公共配置 · 图片上传（user / shop）
# group: DEFAULT_GROUP        format: YAML
# 来源：docs/Nacos配置迁移方案.md §7.4
# 阿里云 OSS（common 自动装配）：四要素配齐才生效。
#   AccessKey 只走环境变量（见 .env.example），绝不写进仓库/Nacos 明文；
#   缺省时 OSS Bean 不创建，上传接口报 503"对象存储未启用"，其余功能不受影响。
# 与下面 multipart 上限同处一地：两者是"上传这条路"的一对，
#   应用层 OssStorageService 的校验与容器层上限互为双保险。
# =============================================================================

aliyun:
  oss:
    endpoint: https://oss-cn-hangzhou.aliyuncs.com
    region: cn-hangzhou
    bucket-name: ${OSS_BUCKET:qk-parent-xcu}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
