# =============================================================================
# Nacos 服务专属配置 · chronic-points-service
# group: DEFAULT_GROUP        format: YAML
# 来源：docs/Nacos配置迁移方案.md §7.8
# 本文件很薄是正常的：internal-token 进了 chronic-common-security.yaml、
# jwt.secret 进了 chronic-common.yaml、数据源池/Flyway/MyBatis-Plus/xxl admin 令牌
# 进了 chronic-common-service.yaml —— 说明该服务的配置确实绝大部分是公共的。
# =============================================================================

spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 2000
  datasource:
    # useAffectedRows=false：与 Connector/J 默认一致，显式写明"匹配行数"语义依赖（复核 P2-11）
    url: jdbc:mysql://${MYSQL_HOST:192.168.100.128}:${MYSQL_PORT:3307}/points?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useAffectedRows=false

xxl:
  job:
    executor:
      appname: chronic-points-service
      port: 9992

# 审计登记（points → shop 的 /internal/audit/record）走 Feign，必须收紧超时：
# openfeign 默认读超时 60s，shop-service 卡住会把用户的资产查询一起拖死；
# 而审计失败是允许的（见 AiAuditRecorder：只告警不阻断），故快速失败。
# 超时配置已并入上方 spring.cloud.openfeign（Boot 3 起 feign.* 更名），
# 与本地 application.yml 保持一致；改这里后需重新导入 Nacos（import-all.ps1）。
