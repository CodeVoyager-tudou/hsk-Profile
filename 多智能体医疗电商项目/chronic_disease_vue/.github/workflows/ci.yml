name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-and-build:
    name: 单测 + 生产构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: 单元测试
        run: npm run test

      - name: 生产构建（.env.production 已关闭演示兜底）
        run: npm run build:prod
