# =============================================================================
# 慢性病管理系统 nginx 配置
#
# 架构：
#   浏览器 --> nginx:80 ─┬─ /            前端静态资源（vue build 产物）
#                        └─ /api/**      Java 网关(8080) -> 各微服务
#   前端 AI 请求链路：/api/ai/** -> 网关 -> user-service（SSE 输出）
#   user-service --WebClient--> nginx:9000 --> Python AI 多实例(8001/8002) 负载均衡
#   Python 不直接面向前端
#
# 启动：nginx -c /path/to/chronic.conf
# 开发调试仍可走 vite(5173) 代理到 8080，生产/联调建议统一走本配置。
# =============================================================================
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # --- Python AI 服务负载均衡（app.py 多实例，启动示例：
    #     uvicorn app:app --port 8001 / --port 8002） ---
    # 默认轮询；会话历史（checkpoint）由 PostgreSQL 共享（core/chat_session.py），
    # 若连接不可用自动降级为进程内存储，请改用 ip_hash 保持同一用户会话粘住同一实例
    upstream chronic_ai {
        server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8002 max_fails=3 fail_timeout=10s;
        # ip_hash;
        keepalive 32;
    }

    # --- Java 网关（多实例可继续追加，实现网关层负载均衡） ---
    upstream chronic_gateway {
        server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # --- 对外入口：前端静态 + API 反代 ---
    server {
        listen      80;
        server_name localhost;

        # 前端静态资源（按实际 dist 路径修改）
        location / {
            root  /usr/share/nginx/html/chronic_vue;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # AI 问答走 SSE 流式：必须关闭代理缓冲，token 才能即时下发到浏览器
        location /api/ai/ {
            proxy_pass http://chronic_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            chunked_transfer_encoding on;
        }

        # 其余业务 API（user/points/shop）正常反代网关
        location /api/ {
            proxy_pass http://chronic_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }

    # --- AI 服务负载均衡入口（9000）：user-service 的 WebClient（SSE 拉流/非流式问答）从这里进 ---
    server {
        listen 9000;

        location / {
            proxy_pass http://chronic_ai;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host            $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # SSE 同样关闭缓冲（Python 侧已响应 X-Accel-Buffering: no，此处双保险）
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
