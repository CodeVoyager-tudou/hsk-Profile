[pytest]
# 整目录 pytest 可收集的结构性配置（复核 P2-10）：
# - importlib 模式按文件路径导入测试模块，不需要包身份，
#   仓库根的 __init__.py 不会再引发同名模块双身份冲突；
# - import 约定统一为裸导入（from core... / from agents...），sys.path 由 conftest.py 统一注入；
# - 需要真实向量库/Ollama 的用例标 slow，可用 -m "not slow" 排除。
testpaths = .
addopts = --import-mode=importlib
markers =
    slow: 需要真实向量库/大模型（Ollama）的端到端用例，CI 或快速回归时用 -m "not slow" 排除
