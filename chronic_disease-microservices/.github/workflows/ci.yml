name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    name: 编译 + 单测 + BOM 守卫
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: 源码 BOM 守卫（PowerShell 写入的 BOM 会让 javac 直接失败）
        run: python3 scripts/check-utf8-bom.py .

      - name: 编译并跑单测
        run: mvn -B test

      - name: 单测报告摘要
        if: always()
        run: |
          find . -path '*/surefire-reports/*.txt' -exec tail -n 4 {} \;
