server:
  port: 8082

spring:
  application:
    name: chronic-points-service
  config:
    import:
      # 本地密钥（见 .env.local）：IDE 直接启动时进程环境变量可能停在 IntelliJ 启动那一刻，
      # 后加的系统变量看不到，所以把 .env.local 也当一个配置源读进来（properties 格式）。
      # 候选路径覆盖几种工作目录；文件不存在时 optional 静默跳过，部署机仍走环境变量注入。
      - optional:file:../.env.local[.properties]
      - optional:file:./.env.local[.properties]
      - optional:file:../chronic_disease-microservices/.env.local[.properties]
      - optional:nacos:chronic-common.yaml
      - optional:nacos:chronic-common-service.yaml
      - optional:nacos:chronic-common-security.yaml
      - optional:nacos:chronic-points-service.yaml
  cloud:
    # 审计登记（points → shop 的 /internal/audit/record）走 Feign，必须收紧超时：
    # openfeign 默认读超时 60s，shop-service 卡住时会把用户的资产查询一起拖死，
    # 而审计失败是允许的（见 AiAuditRecorder：只告警不阻断），所以这里快速失败。
    # （Boot 3 / Spring Cloud 2023 起 feign.* 属性命名空间迁移到 spring.cloud.openfeign.*）
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 2000
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.100.128:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_ADDR:192.168.100.128:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yaml
